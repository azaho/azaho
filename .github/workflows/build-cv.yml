name: Build CV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cv/cv.json
      - cv/build.py
      - cv/template.tex
      - .github/workflows/build-cv.yml

permissions:
  contents: write

concurrency:
  group: build-cv-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate LaTeX from JSON
        run: |
          python3 -m unittest cv/test_build.py
          python3 cv/build.py

      - name: Compile PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv/andrii-zahorodnii-cv.tex
          texlive_version: 2024

      - name: Publish generated CV files
        run: |
          if [ -z "$(git status --porcelain -- cv/andrii-zahorodnii-cv.tex cv/andrii-zahorodnii-cv.pdf)" ]; then
            echo "Generated CV is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/andrii-zahorodnii-cv.tex cv/andrii-zahorodnii-cv.pdf
          git commit -m "Rebuild CV"
          git push
